<!-- WORKBENCH_STARTUP_STYLE -->
		<!-- Startup progress is intentionally self-contained so it can render before workbench CSS. -->
		<style>
			html, body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
			}

			#vscode-workbench-startup {
				position: fixed;
				inset: 0;
				z-index: 10000;
				display: flex;
				align-items: center;
				justify-content: center;
				box-sizing: border-box;
				padding: var(--vscode-spacing-size240, 24px);
				color-scheme: light dark;
				color: var(--vscode-foreground, CanvasText);
				background: var(--vscode-editor-background, Canvas);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				transition: opacity 160ms ease-out;
			}

			#vscode-workbench-startup[data-state="ready"] {
				opacity: 0;
				pointer-events: none;
			}

			.vscode-workbench-startup-content {
				width: min(420px, 100%);
			}

			.vscode-workbench-startup-mode {
				display: inline-flex;
				align-items: center;
				min-height: 20px;
				box-sizing: border-box;
				margin: 0;
				padding: var(--vscode-spacing-size20, 2px) var(--vscode-spacing-size80, 8px);
				border-radius: var(--vscode-cornerRadius-circle, 9999px);
				color: var(--vscode-textLink-foreground, LinkText);
				background: color-mix(in srgb, currentColor 12%, Canvas);
				font-size: var(--vscode-fontSize-label2, 11px);
				font-weight: var(--vscode-fontWeight-semiBold, 600);
			}

			.vscode-workbench-startup-title {
				margin: var(--vscode-spacing-size120, 12px) 0 0;
				font-size: var(--vscode-fontSize-heading2, 18px);
				font-weight: var(--vscode-fontWeight-semiBold, 600);
				line-height: 1.4;
			}

			.vscode-workbench-startup-detail {
				min-height: 20px;
				margin: var(--vscode-spacing-size80, 8px) 0 0;
				color: var(--vscode-descriptionForeground, GrayText);
				font-size: var(--vscode-fontSize-body1, 13px);
				font-weight: var(--vscode-fontWeight-regular, 400);
				line-height: 1.5;
			}

			.vscode-workbench-startup-progress {
				height: var(--vscode-spacing-size40, 4px);
				margin-top: var(--vscode-spacing-size240, 24px);
				overflow: hidden;
				border-radius: var(--vscode-cornerRadius-circle, 9999px);
				background: ButtonFace;
				background: color-mix(in srgb, CanvasText 16%, Canvas);
			}

			.vscode-workbench-startup-progress-value {
				position: relative;
				width: var(--vscode-workbench-startup-progress, 18%);
				height: 100%;
				overflow: hidden;
				border-radius: inherit;
				background: var(--vscode-progressBar-background, Highlight);
				transition: width 180ms ease-out;
			}

			.vscode-workbench-startup-progress-value::after {
				position: absolute;
				inset: 0 auto 0 0;
				width: 40%;
				background: color-mix(in srgb, HighlightText 36%, transparent);
				content: "";
				animation: vscode-workbench-startup-sheen 1.4s linear infinite;
			}

			.vscode-workbench-startup-metrics {
				min-height: 18px;
				margin: var(--vscode-spacing-size80, 8px) 0 0;
				color: var(--vscode-descriptionForeground, GrayText);
				font-size: var(--vscode-fontSize-label1, 12px);
				font-variant-numeric: tabular-nums;
				line-height: 1.5;
			}

			.vscode-workbench-startup-action {
				margin-top: var(--vscode-spacing-size200, 20px);
				padding: var(--vscode-spacing-size60, 6px) var(--vscode-spacing-size120, 12px);
				border: var(--vscode-strokeThickness, 1px) solid var(--vscode-button-border, ButtonBorder);
				border-radius: var(--vscode-cornerRadius-small, 4px);
				color: var(--vscode-button-foreground, ButtonText);
				background: var(--vscode-button-background, ButtonFace);
				font: inherit;
				cursor: pointer;
			}

			.vscode-workbench-startup-action:hover {
				background: var(--vscode-button-hoverBackground, Highlight);
			}

			.vscode-workbench-startup-action:focus-visible {
				outline: 2px solid var(--vscode-focusBorder, Highlight);
				outline-offset: 2px;
			}

			.vscode-workbench-startup-action[hidden] {
				display: none;
			}

			@keyframes vscode-workbench-startup-sheen {
				from { transform: translateX(-100%); }
				to { transform: translateX(350%); }
			}

			@media (prefers-reduced-motion: reduce) {
				#vscode-workbench-startup,
				.vscode-workbench-startup-progress-value {
					transition: none;
				}

				.vscode-workbench-startup-progress-value::after {
					animation: none;
				}
			}

			@media (forced-colors: active) {
				.vscode-workbench-startup-progress {
					box-sizing: border-box;
					border: var(--vscode-strokeThickness, 1px) solid CanvasText;
					background: Canvas;
				}

				.vscode-workbench-startup-progress-value {
					background: Highlight;
				}
			}
		</style>
<!-- WORKBENCH_STARTUP_BODY -->
		<div id="vscode-workbench-startup" data-settings="{{WORKBENCH_STARTUP_CONFIGURATION}}" aria-busy="true">
			<div class="vscode-workbench-startup-content">
				<p id="vscode-workbench-startup-mode" class="vscode-workbench-startup-mode"></p>
				<h1 id="vscode-workbench-startup-title" class="vscode-workbench-startup-title"></h1>
				<p id="vscode-workbench-startup-detail" class="vscode-workbench-startup-detail" aria-live="polite"></p>
				<div id="vscode-workbench-startup-progress" class="vscode-workbench-startup-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="18">
					<div class="vscode-workbench-startup-progress-value"></div>
				</div>
				<p id="vscode-workbench-startup-metrics" class="vscode-workbench-startup-metrics"></p>
				<p id="vscode-workbench-startup-network" class="vscode-workbench-startup-metrics"></p>
				<p id="vscode-workbench-startup-cache" class="vscode-workbench-startup-metrics"></p>
				<button id="vscode-workbench-startup-action" class="vscode-workbench-startup-action" type="button" hidden></button>
			</div>
		</div>
<!-- WORKBENCH_STARTUP_SCRIPT -->
	<script>
		(() => {
			const overlay = document.getElementById('vscode-workbench-startup');
			if (!overlay) {
				return;
			}

			let configuration;
			try {
				configuration = JSON.parse(overlay.getAttribute('data-settings'));
			} catch (error) {
				overlay.remove();
				return;
			}

			const modeElement = document.getElementById('vscode-workbench-startup-mode');
			const titleElement = document.getElementById('vscode-workbench-startup-title');
			const detailElement = document.getElementById('vscode-workbench-startup-detail');
			const progressElement = document.getElementById('vscode-workbench-startup-progress');
			const metricsElement = document.getElementById('vscode-workbench-startup-metrics');
			const networkElement = document.getElementById('vscode-workbench-startup-network');
			const cacheElement = document.getElementById('vscode-workbench-startup-cache');
			const actionElement = document.getElementById('vscode-workbench-startup-action');
			const mainScript = document.getElementById('vscode-workbench-main');
			if (!modeElement || !titleElement || !detailElement || !progressElement || !metricsElement || !networkElement || !cacheElement || !actionElement || !mainScript) {
				overlay.remove();
				return;
			}

			const messages = configuration.messages;
			let usingResourceCache = !!configuration.resourceCache;
			let cacheProgress;
			let commitPreparedCache;
			const storageKey = configuration.staticRouteKey ? `vscode.server.workbenchCacheReady:${configuration.staticRouteKey}` : undefined;
			const getCacheRecoveryUrl = recoveryToken => {
				const recoveryUrl = new URL(window.location.href);
				const cacheKey = configuration.staticRouteKey.substring(configuration.staticRouteKey.lastIndexOf('/') + 1);
				recoveryUrl.searchParams.set(configuration.cacheRecoveryQuery, `${cacheKey}.${recoveryToken}`);
				return recoveryUrl.href;
			};
			const createCacheRecoveryToken = () => {
				const randomBytes = new Uint8Array(16);
				if (window.crypto?.getRandomValues) {
					window.crypto.getRandomValues(randomBytes);
				} else {
					for (let index = 0; index < randomBytes.length; index++) {
						randomBytes[index] = Math.floor(Math.random() * 256);
					}
				}
				return Array.from(randomBytes, value => value.toString(16).padStart(2, '0')).join('');
			};
			let storageAvailable = false;
			let cacheMode = 'unknown';
			let knownTotalBytes = 0;
			let storedRecoveryToken;
			if (storageKey) {
				try {
					const storedValue = window.localStorage.getItem(storageKey);
					if (storedValue === '1') {
						cacheMode = 'reuse';
					} else if (storedValue) {
						try {
							const storedRecord = JSON.parse(storedValue);
							if (Number.isFinite(storedRecord?.totalBytes) && storedRecord.totalBytes > 0) {
								knownTotalBytes = storedRecord.totalBytes;
							}
							if (storedRecord?.ready === true) {
								cacheMode = 'reuse';
								if (typeof storedRecord.recoveryToken === 'string' && /^[0-9a-f]{32}$/.test(storedRecord.recoveryToken)) {
									storedRecoveryToken = storedRecord.recoveryToken;
								}
							} else if (storedRecord?.ready === false) {
								cacheMode = 'repair';
							}
						} catch (error) {
							// An invalid advisory cache marker is equivalent to a first load.
						}
					}
					if (cacheMode === 'unknown') {
						cacheMode = 'first';
					}
					storageAvailable = true;
				} catch (error) {
					// Browser storage can be unavailable without preventing the workbench from loading.
				}
			}
			if (!usingResourceCache && storedRecoveryToken && !configuration.recoveryToken) {
				window.location.replace(getCacheRecoveryUrl(storedRecoveryToken));
				return;
			}
			if (configuration.recoveryToken && storedRecoveryToken !== configuration.recoveryToken) {
				cacheMode = 'repair';
			}
			if (usingResourceCache) {
				// A previous successful startup is not proof that any payload is still stored.
				cacheMode = 'checking';
				knownTotalBytes = 0;
			}

			const updateCacheMode = mode => {
				cacheMode = mode;
				overlay.setAttribute('data-cache-mode', mode);
				if (mode === 'first') {
					modeElement.textContent = messages.firstMode;
					titleElement.textContent = messages.firstTitle;
				} else if (mode === 'reuse') {
					modeElement.textContent = messages.reuseMode;
					titleElement.textContent = messages.reuseTitle;
				} else if (mode === 'repair') {
					modeElement.textContent = messages.repairMode;
					titleElement.textContent = messages.repairTitle;
				} else if (mode === 'checking') {
					modeElement.textContent = messages.checkingMode;
					titleElement.textContent = messages.checkingTitle;
				} else if (mode === 'unavailable') {
					modeElement.textContent = messages.unavailableMode;
					titleElement.textContent = messages.unavailableTitle;
				} else {
					modeElement.textContent = messages.unknownMode;
					titleElement.textContent = messages.unknownTitle;
				}
			};

			const staticRoot = new URL(configuration.staticRoot, window.location.origin).href.replace(/\/?$/, '/');
			const observedResources = new Set();
			let processedBytes = 0;
			let transferredBytes = 0;
			let cachedBytes = 0;
			const transferSamples = [];
			let metricsTimer;
			let downloadedResource = false;
			let resourceObserver;
			let progress = 0;
			let slowLoading = false;

			const formatMessage = (template, ...values) => template.replace(/\{(\d+)\}/g, (_, index) => values[Number(index)] ?? '');
			const formatBytes = bytes => {
				let value = bytes;
				let unitIndex = 0;
				while (value >= 1024 && unitIndex < messages.byteUnits.length - 1) {
					value /= 1024;
					unitIndex++;
				}
				const maximumFractionDigits = unitIndex === 0 || value >= 100 ? 0 : value >= 10 ? 1 : 2;
				return `${new Intl.NumberFormat(undefined, { maximumFractionDigits }).format(value)} ${messages.byteUnits[unitIndex]}`;
			};

			const updateAccessibleProgress = () => {
				progressElement.setAttribute('aria-valuetext', `${detailElement.textContent}. ${metricsElement.textContent}. ${networkElement.textContent}. ${cacheElement.textContent}`);
			};

			const updateMetrics = () => {
				const now = window.performance.now();
				// Buffered entries can arrive out of completion order.
				transferSamples.sort((first, second) => first.time - second.time);
				while (transferSamples.length && transferSamples[0].time <= now - 2000) {
					transferSamples.shift();
				}
				const recentBytes = transferSamples.reduce((sum, sample) => sum + sample.bytes, 0);
				const bytesPerSecond = recentBytes / (Math.min(2000, Math.max(1, now)) / 1000);
				if (cacheProgress) {
					metricsElement.textContent = formatMessage(messages.preparedBytes, formatBytes(cacheProgress.completedBytes), formatBytes(cacheProgress.totalBytes), Math.round(cacheProgress.completedBytes / Math.max(1, cacheProgress.totalBytes) * 100));
				} else if (knownTotalBytes > 0) {
					metricsElement.textContent = formatMessage(messages.processedBytesWithTotal, formatBytes(processedBytes), formatBytes(knownTotalBytes), progress);
				} else {
					metricsElement.textContent = formatMessage(messages.processedBytes, formatBytes(processedBytes), progress);
				}
				networkElement.textContent = formatMessage(messages.networkBytes, formatBytes(bytesPerSecond), formatBytes(transferredBytes + (cacheProgress?.transferredBytes ?? 0)));
				cacheElement.textContent = cacheProgress
					? formatMessage(messages.cachedChunks, formatBytes(cacheProgress.cachedBytes), Math.round(cacheProgress.cachedBytes / Math.max(1, cacheProgress.completedBytes) * 100), cacheProgress.completedChunks, cacheProgress.totalChunks)
					: formatMessage(messages.cachedBytes, formatBytes(cachedBytes), processedBytes > 0 ? Math.round(cachedBytes / processedBytes * 100) : 0, observedResources.size);
				updateAccessibleProgress();
			};

			const updateProgress = (value, detail) => {
				if (slowLoading) {
					slowLoading = false;
					overlay.removeAttribute('data-state');
					actionElement.hidden = true;
				}
				progress = Math.max(progress, value);
				overlay.style.setProperty('--vscode-workbench-startup-progress', `${progress}%`);
				progressElement.setAttribute('aria-valuenow', String(progress));
				detailElement.textContent = detail;
				updateMetrics();
			};

			const recordResources = entries => {
				for (const entry of entries) {
					if (entry.entryType !== 'resource' || !entry.name.startsWith(staticRoot)) {
						continue;
					}
					if (usingResourceCache && entry.name.endsWith('.bin')) {
						continue; // The chunk reader counts these bytes live, including unfinished requests.
					}
					const resourceKey = `${entry.name}\n${entry.startTime}`;
					if (observedResources.has(resourceKey)) {
						continue;
					}
					observedResources.add(resourceKey);
					downloadedResource ||= entry.transferSize > 0 && !(entry.responseStatus >= 400);
					const resourceBytes = entry.decodedBodySize || entry.encodedBodySize || 0;
					processedBytes += resourceBytes;
					if (entry.transferSize > 0) {
						transferredBytes += entry.transferSize;
						transferSamples.push({ time: entry.responseEnd, bytes: entry.transferSize });
					} else if (resourceBytes > 0) {
						cachedBytes += resourceBytes;
					}
				}
			};

			window.performance?.setResourceTimingBufferSize?.(10000);
			recordResources(window.performance?.getEntriesByType?.('resource') ?? []);
			if (window.PerformanceObserver) {
				resourceObserver = new PerformanceObserver(entries => recordResources(entries.getEntries()));
				try {
					resourceObserver.observe({ type: 'resource', buffered: true });
				} catch (error) {
					resourceObserver.observe({ entryTypes: ['resource'] });
				}
			}

			updateCacheMode(cacheMode);
			progressElement.setAttribute('aria-label', usingResourceCache ? messages.resourceProgressLabel : messages.progressLabel);
			networkElement.title = usingResourceCache ? messages.chunkDescription : messages.bandwidthDescription;
			cacheElement.title = networkElement.title;
			updateProgress(usingResourceCache ? 0 : 18, messages.loadingResources);

			const reconcileCacheMode = () => {
				if (usingResourceCache || !configuration.staticRouteKey || !observedResources.size) {
					return;
				}

				if (cacheMode === 'reuse' && downloadedResource) {
					updateCacheMode('repair');
				} else if (cacheMode === 'first' && !downloadedResource) {
					updateCacheMode('reuse');
				}
			};
			metricsTimer = window.setInterval(() => {
				reconcileCacheMode();
				updateMetrics();
			}, 500);
			const stopMetrics = () => {
				window.clearInterval(metricsTimer);
				resourceObserver?.disconnect();
			};

			const stylesheet = document.getElementById('vscode-workbench-styles');
			if (stylesheet) {
				const stylesheetLoaded = () => {
					reconcileCacheMode();
					updateProgress(36, messages.loadingResources);
				};
				if (stylesheet.sheet) {
					stylesheetLoaded();
				} else {
					stylesheet.addEventListener('load', stylesheetLoaded, { once: true });
				}
			}

			let ready = false;
			let readinessObserver;
			let recovering = false;
			let actionHandler = () => window.location.reload();
			const prefersReducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
			const persistReadyVersion = () => {
				if (!storageKey || !storageAvailable) {
					return;
				}
				try {
					knownTotalBytes = Math.max(knownTotalBytes, processedBytes);
					window.localStorage.setItem(storageKey, JSON.stringify({
						ready: true,
						totalBytes: knownTotalBytes || undefined,
						recoveryToken: configuration.recoveryToken
					}));
				} catch (error) {
					// Cache status is advisory; startup success must not depend on persistence.
				}
			};
			const invalidateReadyVersion = () => {
				if (!storageKey || !storageAvailable) {
					return;
				}
				try {
					if (knownTotalBytes > 0) {
						window.localStorage.setItem(storageKey, JSON.stringify({ ready: false, totalBytes: knownTotalBytes }));
					} else {
						window.localStorage.removeItem(storageKey);
					}
				} catch (error) {
					// Recovery still works through its distinct resource URLs without persistence.
				}
			};

			const removeOverlay = () => {
				if (!overlay.isConnected) {
					return;
				}
				overlay.remove();
			};

			const completeStartup = () => {
				if (ready) {
					return;
				}
				ready = true;
				window.clearTimeout(slowLoadingTimeout);
				readinessObserver?.disconnect();
				recordResources(window.performance?.getEntriesByType?.('resource') ?? []);
				stopMetrics();
				reconcileCacheMode();
				persistReadyVersion();
				void commitPreparedCache?.();
				commitPreparedCache = undefined;
				updateProgress(100, messages.ready);
				actionElement.hidden = true;
				overlay.setAttribute('aria-busy', 'false');
				overlay.setAttribute('data-state', 'ready');
				if (prefersReducedMotion) {
					removeOverlay();
				} else {
					window.setTimeout(removeOverlay, 220);
				}
			};

			const beginCacheRecovery = () => {
				if (ready || recovering || !configuration.staticRouteKey) {
					return;
				}
				recovering = true;
				window.clearTimeout(slowLoadingTimeout);
				readinessObserver?.disconnect();
				stopMetrics();
				invalidateReadyVersion();
				updateCacheMode('repair');
				slowLoading = false;
				overlay.setAttribute('data-state', 'recovering');
				overlay.setAttribute('aria-busy', 'true');
				detailElement.textContent = messages.recovering;
				updateAccessibleProgress();
				actionElement.hidden = true;
				window.location.replace(getCacheRecoveryUrl(createCacheRecoveryToken()));
			};

			const showLoadError = () => {
				if (ready) {
					return;
				}
				invalidateReadyVersion();
				if (!usingResourceCache && configuration.staticRouteKey && !configuration.recoveryToken) {
					beginCacheRecovery();
					return;
				}
				window.clearTimeout(slowLoadingTimeout);
				stopMetrics();
				transferSamples.length = 0;
				updateMetrics();
				slowLoading = false;
				overlay.setAttribute('data-state', 'error');
				overlay.setAttribute('aria-busy', 'false');
				progressElement.removeAttribute('aria-valuenow');
				detailElement.textContent = usingResourceCache ? messages.chunkLoadError : messages.loadError;
				updateAccessibleProgress();
				actionHandler = !usingResourceCache && configuration.staticRouteKey ? beginCacheRecovery : () => window.location.reload();
				actionElement.textContent = usingResourceCache ? messages.resumeDownload : configuration.staticRouteKey ? messages.retry : messages.reload;
				actionElement.hidden = false;
			};

			const showSlowLoading = () => {
				if (ready) {
					return;
				}
				slowLoading = true;
				overlay.setAttribute('data-state', 'slow');
				detailElement.textContent = messages.slowLoading;
				updateAccessibleProgress();
				actionHandler = () => window.location.reload();
				actionElement.textContent = messages.reload;
				actionElement.hidden = false;
			};

			actionElement.addEventListener('click', () => actionHandler());
			mainScript.addEventListener('load', () => {
				reconcileCacheMode();
				updateProgress(62, messages.startingWorkbench);
			}, { once: true });
			mainScript.addEventListener('error', showLoadError, { once: true });

			const mutationObserver = new MutationObserver(() => {
				if (!document.querySelector('.monaco-workbench')) {
					return;
				}
				mutationObserver.disconnect();
				updateProgress(84, messages.restoringWorkbench);
			});
			mutationObserver.observe(document.body, { childList: true });

			const slowLoadingTimeout = window.setTimeout(showSlowLoading, 60000);

			const didStartWorkbench = () => window.performance?.getEntriesByName('code/didStartWorkbench', 'mark').length > 0;
			if (didStartWorkbench()) {
				completeStartup();
			} else if (window.PerformanceObserver) {
				readinessObserver = new PerformanceObserver(entries => {
					if (entries.getEntries().some(entry => entry.name === 'code/didStartWorkbench')) {
						completeStartup();
					}
				});
				try {
					readinessObserver.observe({ type: 'mark', buffered: true });
				} catch (error) {
					readinessObserver.observe({ entryTypes: ['mark'] });
				}
			}

			if (usingResourceCache) {
				const loadPreparedResources = async () => {
					try {
						const manifestUrl = new URL(configuration.resourceCache, window.location.origin).href;
						const loader = await import(new URL('loader.js', manifestUrl).href);
						if (!loader.isWorkbenchCacheSupported()) {
							usingResourceCache = false;
							updateCacheMode('unavailable');
							updateProgress(18, messages.loadingResources);
							const nativeScript = document.createElement('script');
							nativeScript.type = 'module';
							nativeScript.src = mainScript.src;
							nativeScript.addEventListener('error', showLoadError, { once: true });
							nativeScript.addEventListener('load', () => updateProgress(62, messages.startingWorkbench), { once: true });
							document.body.appendChild(nativeScript);
							return;
						}
						const preparedCache = await loader.prepareWorkbenchCache(manifestUrl, value => {
							const received = value.transferredBytes - (cacheProgress?.transferredBytes ?? 0);
							if (received > 0) {
								transferSamples.push({ time: window.performance.now(), bytes: received });
							}
							cacheProgress = value;
							knownTotalBytes = value.totalBytes;
							updateCacheMode(value.storage === 'unavailable' ? 'unavailable' : value.cachedBytes > 0 ? (value.transferredBytes > 0 ? 'repair' : 'reuse') : value.transferredBytes > 0 ? 'first' : 'checking');
							updateProgress(Math.round(value.completedBytes / Math.max(1, value.totalBytes) * 100), messages.loadingResources);
						});
						commitPreparedCache = preparedCache.commit;
						const style = document.createElement('style');
						style.id = 'vscode-workbench-cached-styles';
						style.textContent = await preparedCache.style.text();
						document.head.appendChild(style);
						updateProgress(100, messages.startingWorkbench);
						const scriptUrl = URL.createObjectURL(preparedCache.script);
						try {
							await import(scriptUrl);
						} finally {
							URL.revokeObjectURL(scriptUrl);
						}
						if (ready) {
							void commitPreparedCache?.();
							commitPreparedCache = undefined;
						}
					} catch (error) {
						console.error('Unable to start from the prepared workbench cache.', error);
						showLoadError();
					}
				};
				void loadPreparedResources();
			}
		})();
	</script>
