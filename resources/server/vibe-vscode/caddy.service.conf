[Service]
EnvironmentFile=/etc/vibe-vscode/service.env
SupplementaryGroups=vibe-vscode
ExecStart=
ExecStart=/usr/bin/caddy run --config ${VIBE_VSCODE_INSTALL_ROOT}/current/resources/server/vibe-vscode/Caddyfile --adapter caddyfile
# The bundled Caddyfile disables the admin API. Apply changes with a restart.
ExecReload=
