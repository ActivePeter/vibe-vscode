name: Vibe CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Immutable source commit selected by the release workflow
        type: string
        default: ''

concurrency:
  group: vibe-ci-${{ inputs.source_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.source_ref == '' }}

permissions:
  contents: read

env:
  NPM_ARCH: x64
  VSCODE_ARCH: x64
  VSCODE_QUALITY: oss

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: vibe-node_modules-linux
          key-args: "linux ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Install system dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e
          for attempt in {1..3}; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed on attempt $attempt; retrying..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ env.NPM_ARCH }}

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

  validate:
    name: Quality & Focused Tests
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: vibe-node_modules-linux
          key-args: "linux ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Release cache archive space
        run: rm -rf .build/node_modules_cache

      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libxkbfile-dev libkrb5-dev

      - name: Test development deployment contract
        run: ./.agents/skills/deploy-vscode-18080/tests/deploy-18080.test.sh

      - name: Type check build tooling
        working-directory: build
        run: npm run typecheck

      - name: Validate VS Code API declarations
        run: npm run vscode-dts-compile-check

      - name: Compile client and Vibe extension
        run: npm exec -- npm-run-all2 -lp compile-client compile-vibe-vscode

      - name: Repository hygiene
        id: hygiene
        continue-on-error: true
        run: npm run hygiene

      - name: ESLint
        id: eslint
        continue-on-error: true
        run: npm run eslint

      - name: Validate dependency layers
        id: layers
        continue-on-error: true
        run: npm run valid-layers-check

      - name: Test build scripts
        id: build-tests
        continue-on-error: true
        run: npm run test-build-scripts

      - name: Download Electron
        id: electron
        continue-on-error: true
        run: npm run electron -- ${{ env.VSCODE_ARCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Electron sandbox
        if: steps.electron.outcome == 'success'
        run: |
          sudo chown root .build/electron/chrome-sandbox
          sudo chmod 4755 .build/electron/chrome-sandbox

      - name: Run Vibe regression unit tests
        id: unit-tests
        if: steps.electron.outcome == 'success'
        continue-on-error: true
        run: |
          # Discover new tests within each product area; never register individual test files.
          xvfb-run -a ./scripts/test.sh \
            --runGlob '{vs/base/test/{browser/ui/tree,node},vs/code/test/browser,vs/platform/sign/test,vs/server/test,vs/sessions/test,vs/workbench/api/test,vs/workbench/contrib/{chat,remote,files,terminal,update,workspace}/test,vs/workbench/services/{editor,accounts,authentication,environment,logicalWorkspace}/test,vs/workbench/test/browser}/**/*.test.js' \
            --excludeRunGlob '**/electron-*/**/*.test.js' \
            --timeout 20000
        env:
          VSCODE_SKIP_PRELAUNCH: '1'
          TZ: UTC

      - name: Verify quality and tests
        if: always()
        env:
          HYGIENE_RESULT: ${{ steps.hygiene.outcome }}
          ESLINT_RESULT: ${{ steps.eslint.outcome }}
          LAYERS_RESULT: ${{ steps.layers.outcome }}
          BUILD_TESTS_RESULT: ${{ steps.build-tests.outcome }}
          ELECTRON_RESULT: ${{ steps.electron.outcome }}
          UNIT_TESTS_RESULT: ${{ steps.unit-tests.outcome }}
        run: |
          test "$HYGIENE_RESULT" = success
          test "$ESLINT_RESULT" = success
          test "$LAYERS_RESULT" = success
          test "$BUILD_TESTS_RESULT" = success
          test "$ELECTRON_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success

  package:
    name: Clean Product Package (${{ matrix.variant }})
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: bundled
            task_suffix: ''
          - variant: minified
            task_suffix: '-min'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify clean extension checkout
        run: test ! -e extensions/vibe-vscode/dist

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules cache
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: vibe-node_modules-linux
          key-args: "linux ${{ env.VSCODE_ARCH }} $(node -p process.arch)"

      - name: Release cache archive space
        run: rm -rf .build/node_modules_cache

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Build clean Web Server product (${{ matrix.variant }})
        run: npm run gulp vscode-reh-web-linux-${{ env.VSCODE_ARCH }}${{ matrix.task_suffix }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Each mangler worker owns a full TypeScript language service. Keep the
          # GitHub-hosted runner below its memory limit while preserving local defaults.
          VSCODE_MANGLE_WORKERS: '1'

      - name: Verify packaged Web cache
        run: node build/web-release.ts verify ../vscode-reh-web-linux-x64

      - name: Verify release archive and production launcher
        run: node build/web-release.ts package ../vscode-reh-web-linux-x64 .build/release-validation v0.0.0-ci "$(git rev-parse HEAD)"

      - name: Verify packaged Vibe extension
        env:
          PACKAGE_ROOT: ${{ github.workspace }}/../vscode-reh-web-linux-x64
        run: |
          test -f "$PACKAGE_ROOT/extensions/vibe-vscode/dist/browser/extension.js"
          test -f "$PACKAGE_ROOT/extensions/vibe-vscode/package.nls.zh-cn.json"
          test -f "$PACKAGE_ROOT/extensions/vibe-vscode/l10n/bundle.l10n.json"
          test -f "$PACKAGE_ROOT/extensions/vibe-vscode/l10n/bundle.l10n.zh-cn.json"
          node -e "const manifest = require(process.env.PACKAGE_ROOT + '/extensions/vibe-vscode/package.json'); if (manifest.browser !== './dist/browser/extension.js') { throw new Error('Unexpected packaged browser entry: ' + manifest.browser); }"
          node -e "const bundle = require(process.env.PACKAGE_ROOT + '/extensions/vibe-vscode/l10n/bundle.l10n.zh-cn.json'); if (bundle['Close'] !== '关闭') { throw new Error('Missing Vibe runtime translation'); }"

  required:
    name: Vibe CI Required
    if: always()
    needs:
      - dependencies
      - validate
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$DEPENDENCIES_RESULT" = success
          test "$VALIDATE_RESULT" = success
          test "$PACKAGE_RESULT" = success
