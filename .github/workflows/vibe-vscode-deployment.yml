name: Vibe VS Code Deployment

on:
  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - '.agents/skills/deploy-vscode-18080/**'
      - '.github/workflows/vibe-vscode-deployment.yml'
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - '.agents/skills/deploy-vscode-18080/**'
      - '.github/workflows/vibe-vscode-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-transaction:
    name: Development Deployment Transaction
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Test Deployment Transaction
        run: ./.agents/skills/deploy-vscode-18080/tests/deploy-18080.test.sh
