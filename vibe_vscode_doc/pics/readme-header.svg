<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title">
	<title id="title">vibe vscode</title>
	<style>
		@media (prefers-color-scheme: dark) {
			.background-start { stop-color: #141D2E; }
			.background-end { stop-color: #101725; }
		}
	</style>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop class="background-start" stop-color="#F8FAFD"/>
			<stop class="background-end" offset="1" stop-color="#F0F4FC"/>
		</linearGradient>
		<filter id="logo-shadow" x="-75%" y="-75%" width="250%" height="275%" color-interpolation-filters="sRGB">
			<feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#233D76" flood-opacity=".16"/>
		</filter>
		<clipPath id="vibe-logo">
			<rect width="64" height="64" rx="14"/>
		</clipPath>
	</defs>
	<rect width="1280" height="360" rx="24" fill="url(#background)"/>
	<g transform="translate(340 124)">
		<g transform="scale(1.75)" filter="url(#logo-shadow)">
			<g clip-path="url(#vibe-logo)">
				<rect width="64" height="64" fill="#FFFFFF"/>
				<path d="M0 25.333333H21L32 45.333333L43 25.333333H64V64H0Z" fill="#2864F0"/>
			</g>
		</g>
		<text x="152" y="86" fill="#2864F0" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="600" letter-spacing="-3" textLength="448" lengthAdjust="spacingAndGlyphs">vibe vscode</text>
	</g>
</svg>
