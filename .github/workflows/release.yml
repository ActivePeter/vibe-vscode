name: Vibe Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to validate and package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vibe-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Verify tag and commit
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$commit"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  validate:
    name: Release quality gates
    needs: source
    uses: ./.github/workflows/vibe-ci.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}

  package:
    name: Linux x64 release archive
    needs: [source, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      VSCODE_QUALITY: oss
      VSCODE_MANGLE_WORKERS: '1'
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.source.outputs.commit }}
          lfs: true
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Restore validated dependencies
        id: dependencies
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: vibe-node_modules-linux
          key-args: "linux ${{ env.VSCODE_ARCH }} $(node -p process.arch)"
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev
      - name: Install dependencies on cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: x64
      - name: Release dependency archive space
        run: rm -rf .build/node_modules_cache
      - name: Build production Web Server
        run: npm run gulp vscode-reh-web-linux-x64-min
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and archive immutable release
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: node build/web-release.ts package ../vscode-reh-web-linux-x64 .build/release "$RELEASE_TAG" "$SOURCE_COMMIT"
      - name: Upload release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibe-vscode-release-linux-x64
          if-no-files-found: error
          path: |
            .build/release/*.tar.gz
            .build/release/*.sha256

  publish:
    name: Create draft GitHub Release
    needs: [source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibe-vscode-release-linux-x64
          path: release
      - name: Create release for the existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_COMMIT"
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Vibe VS Code $RELEASE_TAG" --generate-notes
